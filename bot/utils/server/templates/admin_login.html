<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | SocketChat</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/admin.css') }}"
    >

</head>

<body>

<div class="admin-login-container">


    <form
        method="POST"
        class="admin-login-card"
    >


        <div class="admin-logo">

            <div>◉</div>

            <h1>Admin Panel</h1>

            <p>
                SocketChat administration
            </p>

        </div>


        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <div class="form-group">

            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >

        </div>


        <button type="submit">

            Login

        </button>


        <a href="/">

            ← Back to chat

        </a>


    </form>


</div>

</body>

</html>
